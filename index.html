<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a2c1a">
<title>Bakery Billing System</title>
<style>
:root{--choc:#4a2c1a;--choc2:#6b4128;--gold:#b8893b;--gold2:#d9b25f;--cream:#fbf6ec;--ink:#2b1d14;--mute:#7b6a5c;--line:#e8dcc8;--ok:#2e7d4f;--warn:#c27a12;--bad:#b3392f;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.35}
h1,h2,h3,h4{font-family:Georgia,'Times New Roman',serif;color:var(--choc);margin:0}
h2{font-size:22px}h3{font-size:18px}h4{font-size:15px;margin:14px 0 6px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:10px;padding:9px 16px;background:var(--choc);color:#fff;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{background:var(--choc2)}
.btn.gold{background:var(--gold)}.btn.gold:hover{background:#a37a31}
.btn.ghost{background:transparent;color:var(--choc);border:1.5px solid var(--line)}.btn.ghost:hover{background:#f6ecd9}
.btn.bad{background:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:42px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);border-color:var(--gold)}
label{display:block;font-size:11.5px;font-weight:700;color:var(--mute);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 1px 3px rgba(74,44,26,.06)}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
.mute{color:var(--mute)}.small{font-size:12.5px}.r{text-align:right}.b{font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eee;color:#555}
.badge.ok{background:#dff3e6;color:var(--ok)}.badge.warn{background:#fdecc8;color:#8a5600}.badge.bad{background:#f8dcd8;color:var(--bad)}.badge.gold{background:#f6e6c0;color:#7a5410}.badge.choc{background:var(--choc);color:#f6e6c0}
/* login */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(160deg,#4a2c1a,#6b4128 55%,#b8893b)}
.loginbox{background:#fffaf0;border-radius:18px;padding:26px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.35);border:2px solid var(--gold2)}
.loginbox .lg{width:76px;height:76px;margin:0 auto 8px;display:block}.loginbox .lg img,.loginbox .lg svg{width:100%;height:100%;object-fit:contain}
.loginbox h1{text-align:center;font-size:26px}.loginbox .tg{text-align:center;color:var(--gold);font-style:italic;margin-bottom:10px}
.hint{background:#fdf1d6;border:1px dashed var(--gold);border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:12px}
/* shell */
#app{display:none}
.top{position:sticky;top:0;z-index:30;background:var(--choc);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:3px solid var(--gold)}
.top .lg{width:38px;height:38px}.top .lg img,.top .lg svg{width:100%;height:100%;object-fit:contain}
.top .nm{font-family:Georgia,serif;font-size:18px;font-weight:700;color:#f6e6c0}
.top .who{margin-left:auto;text-align:right;font-size:12.5px;line-height:1.2}
.top .btn{min-height:34px;padding:5px 12px}
.shell{display:flex;align-items:flex-start}
.ham{flex:none;width:42px;height:42px;border:1.5px solid #8a6a45;border-radius:10px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;min-height:0}
.ham:hover{background:rgba(255,255,255,.1)}
.ham span{display:block;width:20px;height:2.5px;background:#f6e6c0;border-radius:2px;transition:transform .25s,opacity .2s}
body.menu-open .ham span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
body.menu-open .ham span:nth-child(2){opacity:0}
body.menu-open .ham span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.side{position:fixed;top:58px;left:0;bottom:0;width:250px;max-width:82vw;background:#fff;border-right:3px solid var(--gold);padding:10px;z-index:45;overflow-y:auto;transform:translateX(-105%);transition:transform .25s ease;box-shadow:none}
body.menu-open .side{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.25)}
.side a{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;color:var(--ink);cursor:pointer;font-weight:600;margin-bottom:3px;user-select:none;font-size:15.5px}
.side a:hover{background:#f6ecd9}.side a.on{background:var(--choc);color:#f6e6c0}
.scrim{position:fixed;inset:58px 0 0 0;background:rgba(40,25,15,.45);z-index:44;opacity:0;pointer-events:none;transition:opacity .25s}
body.menu-open .scrim{opacity:1;pointer-events:auto}
main{flex:1;padding:16px;min-width:0}
@media(max-width:860px){main{padding:12px 12px 24px}.top .who span.rl{display:none}.top .nm{font-size:16px}}
.top{height:58px;flex-wrap:nowrap;padding-top:0;padding-bottom:0}.top .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top .who{flex:none}.top .lg{flex:none}
@media(max-width:560px){.top{gap:8px;padding:0 10px}.top .who>div:first-child{display:none}.top .who>div:last-child{display:flex;gap:6px}.top .who .btn{padding:4px 9px;font-size:12.5px;min-height:32px}}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.ph h2{margin-right:auto}
.warnbar{background:#fdecc8;border:1px solid #e9c46a;border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:#f6ecd9;color:var(--choc);text-align:left;padding:9px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
table.t td{padding:9px 10px;border-top:1px solid #f0e6d3;vertical-align:middle}
table.t tr:hover td{background:#fffaf0}
.rc{display:inline-block;background:#f6ecd9;border-radius:8px;padding:2px 8px;margin:2px 3px 2px 0;font-size:12.5px;white-space:nowrap}.rc s{color:var(--mute)}.rc b.sp{color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font-weight:700;cursor:pointer;color:var(--choc)}.tabs button.on{background:var(--choc);color:#f6e6c0;border-color:var(--choc)}
.sw{position:relative;display:inline-block;width:42px;height:24px}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:#ccc;border-radius:99px;transition:.2s;cursor:pointer}.sw span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+span{background:var(--ok)}.sw input:checked+span:before{transform:translateX(18px)}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:var(--r);padding:12px}
.kpi .l{font-size:12px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.kpi .v{font-family:Georgia,serif;font-size:24px;color:var(--choc);font-weight:700}.kpi .s{font-size:12px;color:var(--mute)}
.kpi.bad{border-left-color:var(--bad)}.kpi.ok{border-left-color:var(--ok)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .bar{width:100%;max-width:46px;background:linear-gradient(var(--gold2),var(--gold));border-radius:6px 6px 0 0;min-height:2px}
.bars .bv{font-size:10.5px;color:var(--mute);white-space:nowrap}.bars .bl{font-size:11px;font-weight:700;margin-top:3px;white-space:nowrap}
/* POS */
.pos{display:grid;grid-template-columns:1fr 430px;gap:14px;align-items:start}
@media(max-width:1100px){.pos{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--choc)}.chips button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.pc:hover{border-color:var(--gold);box-shadow:0 2px 8px rgba(184,137,59,.25)}.pc .n{font-weight:700;color:var(--choc)}.pc .p{font-family:Georgia,serif;font-size:17px;color:var(--gold)}.pc.off{opacity:.45;cursor:not-allowed}
.cartpanel{position:sticky;top:70px;max-height:calc(100vh - 84px);overflow:auto}
@media(max-width:1100px){.cartpanel{position:static;max-height:none}}
.cl{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:9px 0;border-top:1px solid #f0e6d3}
.cl .nm{font-weight:700}.cl .ctl{display:flex;gap:6px;align-items:center;grid-column:1/3;flex-wrap:wrap}
.cl .lt{font-weight:700;text-align:right}.cl.bad{background:#fdeceb}
.stp{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}.stp button{border:0;background:#f6ecd9;width:34px;height:34px;font-size:18px;cursor:pointer}.stp input{width:58px;border:0;border-radius:0;text-align:center;min-height:34px;padding:4px}
.dsc{width:64px!important;min-height:34px!important;padding:4px 6px!important}
.tot{display:flex;justify-content:space-between;padding:3px 0}.tot.g{background:var(--choc);color:#e9c46a;border:2px solid var(--gold);border-radius:10px;padding:10px 12px;margin:8px 0;font-family:Georgia,serif;font-size:21px;font-weight:700}
.mbar{display:none;position:fixed;left:10px;right:10px;bottom:12px;z-index:34}
.mbar button{width:100%;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@media(max-width:1100px){.mbar{display:block}}
/* modal / toast */
.mback{position:fixed;inset:0;background:rgba(40,25,15,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:18px 10px;overflow:auto}
.modal{background:#fffdf8;border-radius:16px;width:100%;max-width:560px;box-shadow:0 12px 40px rgba(0,0,0,.4);border:2px solid var(--gold2)}.modal.wide{max-width:900px}
.mh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.mh h3{flex:1}.mh .x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--mute)}
.mb{padding:6px 16px 14px}.mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;top:66px;right:10px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 20px)}
.toast{background:var(--choc);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.3);border-left:5px solid var(--gold2);font-weight:600}.toast.bad{border-color:#ff7a6e;background:#7a2a22}.toast.ok{border-color:#79d49b}.toast.warn{border-color:#f2b84b}
.vhead,.vrow{display:grid;grid-template-columns:1.3fr .8fr .8fr .8fr .8fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.vhead{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase}.vrow input,.vrow select{min-height:36px;padding:5px 8px}
@media(max-width:700px){.vhead{display:none}.vrow{grid-template-columns:1fr 1fr;padding:8px;border:1px solid var(--line);border-radius:10px}}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.oc{background:#fff;border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:var(--r);padding:12px}.oc.today{border-top-color:var(--warn)}.oc.late{border-top-color:var(--bad)}.oc.ready{border-top-color:var(--ok)}
.msgq{background:#fdf1d6;border-left:4px solid var(--gold);padding:6px 10px;margin:6px 0;font-family:Georgia,serif;font-size:16px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}.seg button{border:0;background:#fff;padding:7px 14px;font-weight:700;cursor:pointer}.seg button.on{background:var(--choc);color:#f6e6c0}
.pv{background:#e9e2d4;padding:10px;border-radius:10px;overflow:auto;max-height:68vh}
/* invoice */
.inv{background:#fff;color:#2b1d14;font-family:'Segoe UI',Arial,sans-serif;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.inv.a4{width:210mm;min-height:297mm;padding:12mm 13mm;font-size:12px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.2);display:flex;flex-direction:column}
.inv .ih{display:flex;justify-content:space-between;align-items:center;border-bottom:3px double #b8893b;padding-bottom:10px;gap:12px}
.inv .brand{display:flex;gap:12px;align-items:center}.inv .brand img,.inv .brand svg{width:66px;height:66px;object-fit:contain}
.inv h1{font-family:Georgia,serif;font-size:26px;margin:0;color:#4a2c1a}.inv .tag{color:#b8893b;font-style:italic;font-size:12px}
.inv .meta{text-align:right}.inv .ti{font-family:Georgia,serif;font-size:19px;letter-spacing:.14em;color:#b8893b;font-weight:700}
.inv .bt{display:flex;justify-content:space-between;gap:12px;margin-top:12px;background:#fbf6ec;border:1px solid #eadfca;border-radius:6px;padding:8px 10px}
.inv table{width:100%;border-collapse:collapse;margin-top:12px}
.inv th{background:#4a2c1a;color:#f6e6c0;padding:7px 6px;text-align:left;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.inv td{padding:6px;border-bottom:1px solid #eadfca;vertical-align:top}.inv tbody tr:nth-child(even) td{background:#fcf8f0}
.inv .r{text-align:right}.inv .sub{font-size:10.5px;color:#7b6a5c}
.inv .sum{display:flex;gap:16px;margin-top:10px;align-items:flex-start}.inv .sum>div{flex:1}
.inv .tl{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted #d9c9a8}
.inv .gt{background:#4a2c1a;color:#e9c46a;padding:11px 14px;display:flex;justify-content:space-between;font-family:Georgia,serif;font-size:20px;font-weight:700;border-radius:6px;margin-top:8px;border:2px solid #b8893b}
.inv .bd{display:flex;justify-content:space-between;padding:6px 0;font-weight:700;color:#b3392f}
.inv .foot{margin-top:auto;padding-top:16px;text-align:center;color:#7b6a5c;font-size:11px;border-top:1px solid #eadfca}
.inv .wm{position:absolute;top:38%;left:12%;font-size:120px;color:rgba(179,57,47,.16);transform:rotate(-24deg);font-weight:800;pointer-events:none;letter-spacing:.1em}
.inv.th{width:76mm;padding:3mm;font-size:11.5px;font-family:'Courier New',monospace;margin:0 auto;color:#000}
.inv.th .c{text-align:center}.inv.th hr{border:0;border-top:1px dashed #000;margin:5px 0}.inv.th .l2{display:flex;justify-content:space-between}.inv.th img,.inv.th svg{width:44px;height:44px}
.inv.th .wm{font-size:60px;left:10%}
#printArea{display:none}
@media print{body.printing{background:#fff}body.printing #app,body.printing #login,body.printing .mback,body.printing .toasts{display:none!important}body.printing #printArea{display:block!important}.inv.a4{box-shadow:none;width:auto;min-height:277mm;padding:0}.inv.th{width:auto}}
 
/* flags + notifications */
.flag{display:inline-block;width:34px;height:23px;border-radius:3px;border:1px solid rgba(0,0,0,.3);position:relative;overflow:hidden;flex:none;vertical-align:middle;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.flag.in{background:linear-gradient(#ff9933 0 33.4%,#fff 33.4% 66.6%,#138808 66.6%)}
.flag.in:after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border:1.5px solid #000080;border-radius:50%;background:radial-gradient(#000080 0 1px,transparent 1.5px)}
.flag.de{background:linear-gradient(#000 0 33.4%,#dd0000 33.4% 66.6%,#ffce00 66.6%)}
.fstrip{height:14px;margin:-12px -12px 8px;border-radius:11px 11px 0 0}
.fstrip.in{background:linear-gradient(#ff9933 0 33.4%,#fff 33.4% 66.6%,#138808 66.6%);border-bottom:1px solid #e3e3e3}
.fstrip.de{background:linear-gradient(#000 0 33.4%,#dd0000 33.4% 66.6%,#ffce00 66.6%)}
.oc.in,.oc.de{border-top-width:1px}
.oc.in{background:linear-gradient(180deg,#fff8f0,#fff 35%)}.oc.de{background:linear-gradient(180deg,#fffbe8,#fff 35%)}
.fl-line{display:flex;align-items:center;gap:8px;margin-top:6px;padding:5px 8px;border-radius:8px;font-size:14px}
.fl-line.in{background:#eef8ec;border:1px solid #138808;color:#0b5a05}.fl-line.de{background:#fff6d6;border:1px solid #dd0000;color:#7a0000}
.bell{position:relative;flex:none;width:42px;height:42px;border:1.5px solid #8a6a45;border-radius:10px;background:transparent;cursor:pointer;font-size:19px;line-height:1;padding:0;min-height:0;color:#fff}
.bell:hover{background:rgba(255,255,255,.1)}
.bcnt{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:99px;background:#d62828;color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--choc)}
.npanel{position:fixed;top:62px;right:8px;width:min(400px,calc(100vw - 16px));max-height:72vh;overflow:auto;background:#fffdf8;border:2px solid var(--gold2);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);z-index:60;padding:10px}
.npanel[hidden]{display:none}
.nph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-family:Georgia,serif;font-size:17px;color:var(--choc);font-weight:700}
.nit,.ai{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;margin-bottom:6px}
.nit:hover,.ai:hover{filter:brightness(.97)}
.nit .ic,.ai .ic{font-size:20px;line-height:1.1;flex:none;width:34px;text-align:center}
.nit.in,.ai.in{border-left:6px solid #138808;background:linear-gradient(90deg,#fff1e0,#fff 45%,#e8f5e6)}
.nit.de,.ai.de{border-left:6px solid #dd0000;background:linear-gradient(90deg,#efefef,#fff 45%,#fff3c4)}
.nit.today,.ai.today{border-left:6px solid var(--warn);background:#fdf1d6}
.nit.late,.ai.late{border-left:6px solid var(--bad);background:#fdeceb}
.nit.stock,.ai.stock{border-left:6px solid var(--gold)}
.astrip{margin-bottom:12px}
.toast.fl{display:flex;gap:10px;align-items:center;max-width:380px}.toast .tx{flex:1;font-size:14px;line-height:1.3}.toast .tx-x{border:0;background:transparent;color:#fff;font-size:16px;cursor:pointer;padding:0 2px}
.toast.fl-in{border-left-color:#138808;background:#2b2b2b}.toast.fl-de{border-left-color:#ffce00;background:#1f1f1f}
@media(max-width:430px){.top .lg{display:none}}
body.printing #npanel{display:none!important}
</style>
</head>
<body>
<div id="login" class="loginwrap"></div>
<div id="app">
  <header class="top">
    <button class="ham" data-act="menu" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="lg" id="tlogo"></div><div class="nm" id="tname"></div>
    <button class="bell" data-act="bell" aria-label="Notifications">🔔<span id="bcnt" class="bcnt"></span></button>
    <div class="who"><div><b id="uname"></b> <span class="rl badge gold" id="urole"></span></div><div><button class="btn ghost sm" style="color:#f6e6c0;border-color:#8a6a45" data-act="pinChange">Change PIN</button> <button class="btn gold sm" data-act="logout">Logout</button></div></div>
  </header>
  <div class="scrim" data-act="menuClose"></div>

function payCalc(total){
  const p=k=>Math.max(0,Number(cart.pay[k])||0),cash=p('cash'),tendered=r2(p('cash')+p('upi')+p('card')+p('other'));
  const excess=Math.max(0,r2(tendered-total)),change=Math.min(excess,cash),valid=excess<=cash+0.001;
  const pays=[['cash',r2(cash-change)],['upi',p('upi')],['card',p('card')],['other',p('other')]].filter(x=>x[1]>0).map(([mode,amount])=>({mode,amount}));
  const applied=r2(pays.reduce((a,x)=>a+x.amount,0));
  return{tendered,change:r2(change),valid,pays,applied,balance:r2(Math.max(0,total-applied))};
}

function drawPay(c){

/* ============ REPORT ENGINE ============ */
function periodRange(p,from,to){const t=today();if(p==='today')return[t,t];if(p==='yesterday'){const y=addDays(t,-1);return[y,y]}if(p==='week')return[weekStart(t),t];if(p==='month')return[t.slice(0,8)+'01',t];if(p==='30')return[addDays(t,-29),t];return[from||t,to||t]}
function lineRows(invs){return invs.flatMap(i=>i.lines.map(l=>({...l,date:i.date,inv:i})))}
function aggBy(rows,keyFn){const m={};rows.forEach(l=>{const k=keyFn(l);(m[k]??={q:0,s:0,p:0});m[k].q+=l.qty;m[k].s+=l.total;m[k].p+=l.taxable-l.cost*l.qty});return m}
const payIn=(f,t)=>activeInvs().flatMap(i=>(i.payments||[]).filter(p=>p.date>=f&&p.date<=t));
const outstanding=()=>activeInvs().reduce((a,i)=>a+Math.max(0,balOf(i)),0);

  <div class="kpis"><div class="kpi"><div class="l">Sales</div><div class="v">${money(sales)}</div></div><div class="kpi"><div class="l">Invoices</div><div class="v">${invs.length}</div></div><div class="kpi"><div class="l">Items sold</div><div class="v">${num(items)}</div></div><div class="kpi"><div class="l">Discounts</div><div class="v">${money(disc)}</div></div><div class="kpi"><div class="l">GST</div><div class="v">${money(gst)}</div></div><div class="kpi ok"><div class="l">Collected</div><div class="v">${money(collected)}</div></div><div class="kpi bad"><div class="l">Outstanding (all)</div><div class="v">${money(outstanding())}</div></div>${prof?`<div class="kpi ok"><div class="l">Est. profit</div><div class="v">${money(profit)}</div><div class="s">taxable − cost price</div></div>`:''}</div>
  <div class="card" style="margin-bottom:12px"><h3>Sales trend</h3><div class="bars">${pk.slice(-24).map(k=>`<div class="bc"><div class="bv">₹${num(Math.round(per[k].s))}</div><div class="bar" style="height:${Math.max(2,per[k].s/mx*100)}%"></div><div class="bl">${rp.g==='month'?k.slice(5):k.slice(5)}</div></div>`).join('')||'<span class="mute">No data</span>'}</div></div>
  <div class="ph"><h3>${{day:'Daily',week:'Weekly',month:'Monthly'}[rp.g]} sales</h3><button class="btn ghost sm" data-act="csv" data-k="period">Export CSV</button></div>
  <div class="tw"><table class="t"><thead><tr><th>Period</th><th class="r">Invoices</th><th class="r">Discount</th><th class="r">GST</th><th class="r">Sales</th></tr></thead><tbody>${pk.map(k=>`<tr><td>${lbl(k)}</td><td class="r">${per[k].n}</td><td class="r">${money(per[k].d)}</td><td class="r">${money(per[k].g)}</td><td class="r"><b>${money(per[k].s)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="mute">No sales in this period.</td></tr>'}</tbody></table></div>
  <div class="ph" style="margin-top:16px"><h3>Category-wise sales</h3><button class="btn ghost sm" data-act="csv" data-k="cat">Export CSV</button></div>
  <div class="tw"><table class="t"><thead><tr><th>Category</th><th class="r">Qty</th><th class="r">Sales</th><th class="r">Share</th>${prof?'<th class="r">Profit</th>':''}</tr></thead><tbody>${Object.entries(cat).sort((a,b)=>b[1].s-a[1].s).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${num(v.q)}</td><td class="r"><b>${money(v.s)}</b></td><td class="r">${sales?Math.round(v.s/sales*100):0}%</td>${prof?`<td class="r">${money(v.p)}</td>`:''}</tr>`).join('')||'<tr><td colspan="5" class="mute">No data.</td></tr>'}</tbody></table></div>
  <div class="ph" style="margin-top:16px"><h3>Product-wise sales</h3><button class="btn ghost sm" data-act="csv" data-k="prod">Export CSV</button></div>
  <div class="tw"><table class="t"><thead><tr><th>Product</th><th class="r">Qty</th><th class="r">Sales</th>${prof?'<th class="r">Profit</th>':''}</tr></thead><tbody>${prod.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${num(v.q)}</td><td class="r"><b>${money(v.s)}</b></td>${prof?`<td class="r">${money(v.p)}</td>`:''}</tr>`).join('')||'<tr><td colspan="4" class="mute">No data.</td></tr>'}</tbody></table></div>
  <div class="ph" style="margin-top:16px"><h3>Collections by payment mode</h3></div>
  <div class="tw"><table class="t"><tbody>${['cash','upi','card','other'].map(m=>`<tr><td>${m.toUpperCase()}</td><td class="r"><b>${money(pm(m))}</b></td></tr>`).join('')}</tbody></table></div>`;
  $('#rpp').value=rp.p;$('#rpg').value=rp.g;
  $('#rpp').onchange=e=>{rp.p=e.target.value;if(rp.p==='custom'&&!rp.from){rp.from=f;rp.to=t}render()};$('#rpg').onchange=e=>{rp.g=e.target.value;render()};
  if(rp.p==='custom'){$('#rpf').onchange=e=>{rp.from=e.target.value;render()};$('#rpt').onchange=e=>{rp.to=e.target.value;render()}}
  window._rep={f,t,per,pk,lbl,cat,prod,prof};
}
ACT.csv=t=>{
  const r=window._rep,k=t.dataset.k;
  if(k==='period')downloadCSV(`sales-${rp.g}.csv`,[['Period','Invoices','Discount','GST','Sales'],...r.pk.map(x=>[r.lbl(x),r.per[x].n,r2(r.per[x].d),r2(r.per[x].g),r2(r.per[x].s)])]);
  if(k==='cat')downloadCSV('category-sales.csv',[['Category','Qty','Sales',...(r.prof?['Profit']:[])],...Object.entries(r.cat).map(([n,v])=>[n,v.q,r2(v.s),...(r.prof?[r2(v.p)]:[])])]);
  if(k==='prod')downloadCSV('product-sales.csv',[['Product','Qty','Sales',...(r.prof?['Profit']:[])],...r.prod.map(([n,v])=>[n,v.q,r2(v.s),...(r.prof?[r2(v.p)]:[])])]);
};
 
/* ============ USERS ============ */
function pgUsers(el){
  if(!can('users.manage'))return el.innerHTML='<div class="card">Not authorised.</div>';
  el.innerHTML=`<div class="ph"><h2>👥 Users &amp; Access</h2><button class="btn gold" data-act="userEdit" data-id="">＋ Add user</button></div>
  <div class="card small" style="margin-bottom:12px"><b>Access levels</b><br>🔑 <b>Owner / Admin</b> – everything, incl. Rate Master, GST, users, profit. &nbsp;🧑‍💼 <b>Bakery Manager</b> – orders, production status, stock, sales view. &nbsp;🧾 <b>Cashier</b> – billing, search, payments, receipts (cannot enter or change prices). &nbsp;👩‍🍳 <b>Production</b> – confirmed orders, cake specs, production requirements, status updates.</div>
  <div class="tw"><table class="t"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b>${u.id===me.id?' <span class="badge gold">you</span>':''}</td><td>${esc(u.username)}</td><td>${ROLES[u.role]}</td><td>${u.active?'<span class="badge ok">Active</span>':'<span class="badge bad">Disabled</span>'}${u.defPin?' <span class="badge warn">default PIN</span>':''}</td><td class="r" style="white-space:nowrap"><button class="btn ghost sm" data-act="userEdit" data-id="${u.id}">Edit</button> <button class="btn ghost sm" data-act="userPin" data-id="${u.id}">Reset PIN</button></td></tr>`).join('')}</tbody></table></div>`;
}
const ownerCount=()=>db.users.filter(u=>u.role==='owner'&&u.active).length;
ACT.userEdit=t=>{
  if(!can('users.manage'))return deny();
  const u=t.dataset.id?db.users.find(x=>x.id===t.dataset.id):null;
  const m=openModal(u?'Edit user':'Add user',`<label>Full name</label><input name="name" value="${esc(u?.name||'')}"><label>Username</label><input name="un" autocapitalize="none" value="${esc(u?.username||'')}" ${u?'readonly':''}><label>Role</label><select name="role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u?.role===k?'selected':''}>${v}</option>`).join('')}</select>${u?`<label>Status</label><select name="act"><option value="1" ${u.active?'selected':''}>Active</option><option value="0" ${!u.active?'selected':''}>Disabled</option></select>`:`<label>Initial PIN (4–8 digits)</label><input name="pin" type="password" inputmode="numeric">`}`,{foot:`<button class="btn ghost" data-act="mclose">Cancel</button><button class="btn gold" id="ok">Save</button>`});
  $('#ok',m).onclick=async()=>{
    const name=mval(m,'name').trim(),role=mval(m,'role');if(!name)return toast('Enter a name','bad');
    if(u){const act=mval(m,'act')==='1';
      if((u.id===me.id)&&(!act||role!==u.role))return toast('You cannot disable or demote your own account','bad');
      if(u.role==='owner'&&(role!=='owner'||!act)&&ownerCount()<=1)return toast('Keep at least one active Owner','bad');
      if(u.role!==role)audit('user',u.name,'Role changed',ROLES[u.role],ROLES[role]);if(u.active!==act)audit('user',u.name,'Account status',u.active?'Active':'Disabled',act?'Active':'Disabled');
      Object.assign(u,{name,role,active:act});
    }else{
      const un=mval(m,'un').trim().toLowerCase(),pin=mval(m,'pin');
      if(!/^[a-z0-9._-]{3,20}$/.test(un))return toast('Username: 3–20 letters/numbers','bad');if(db.users.some(x=>x.username.toLowerCase()===un))return toast('Username already taken','bad');if(!/^\d{4,8}$/.test(pin))return toast('PIN must be 4–8 digits','bad');
      const salt=uid();db.users.push({id:uid(),name,username:un,role,salt,hash:await hashPin(pin,salt),active:true,defPin:false});audit('user',name,'User created',' —',ROLES[role]);
    }
    save();closeModal();render();
  };
};
ACT.userPin=t=>{
  if(!can('users.manage'))return deny();const u=db.users.find(x=>x.id===t.dataset.id);
  const m=openModal('Reset PIN – '+esc(u.name),`<label>New PIN (4–8 digits)</label><input name="p" type="password" inputmode="numeric">`,{foot:`<button class="btn ghost" data-act="mclose">Cancel</button><button class="btn gold" id="ok">Reset</button>`});
  $('#ok',m).onclick=async()=>{const p=mval(m,'p');if(!/^\d{4,8}$/.test(p))return toast('PIN must be 4–8 digits','bad');u.salt=uid();u.hash=await hashPin(p,u.salt);u.defPin=false;audit('user',u.name,'PIN reset by owner');save();closeModal();toast('PIN reset','ok');if(u.id===me.id)me=u;render()};
};
 
/* ============ SETTINGS ============ */
function pgSettings(el){
  if(!can('settings.edit'))return el.innerHTML='<div class="card">Not authorised.</div>';
  const s=db.settings;
  el.innerHTML=`<div class="ph"><h2>⚙️ Settings</h2></div>
  <div class="card"><h3>Shop &amp; invoice</h3><div class="grid2"><div><label>Shop name</label><input id="s_shopName" value="${esc(s.shopName)}"></div><div><label>Tagline</label><input id="s_tagline" value="${esc(s.tagline)}"></div><div><label>Phone</label><input id="s_phone" value="${esc(s.phone)}"></div><div><label>GSTIN (leave blank if unregistered)</label><input id="s_gstin" value="${esc(s.gstin)}"></div><div><label>UPI ID (printed on invoice)</label><input id="s_upi" value="${esc(s.upi)}" placeholder="shop@upi"></div><div><label>Invoice prefix</label><input id="s_prefix" value="${esc(s.prefix)}" maxlength="8"></div></div>
  <label>Address</label><input id="s_address" value="${esc(s.address)}"><label>Invoice footer note</label><textarea id="s_footer" rows="2">${esc(s.footer)}</textarea>
  <label>Logo</label><div class="row"><div style="width:64px;height:64px">${logoHTML().replace('<img','<img style="width:64px;height:64px;object-fit:contain"')}</div><input type="file" id="s_logo" accept="image/*"><button class="btn ghost sm" data-act="logoClear">Use default</button></div></div>
  <div class="card" style="margin-top:12px"><h3>Billing rules</h3><div class="grid2"><div><label>Entered prices already include GST?</label><select id="s_gstInclusive"><option value="0" ${!s.gstInclusive?'selected':''}>No – add GST on top</option><option value="1" ${s.gstInclusive?'selected':''}>Yes – prices are GST-inclusive</option></select></div><div><label>Show GST as CGST + SGST?</label><select id="s_gstSplit"><option value="1" ${s.gstSplit?'selected':''}>Yes (intra-state)</option><option value="0" ${!s.gstSplit?'selected':''}>No – single GST line</option></select></div><div><label>Round grand total to nearest ₹1</label><select id="s_roundOff"><option value="1" ${s.roundOff?'selected':''}>Yes</option><option value="0" ${!s.roundOff?'selected':''}>No</option></select></div><div><label>Max discount a cashier can give (%)</label><input id="s_maxDisc" type="number" min="0" max="100" value="${s.maxDisc}"></div></div>
  <label>Cake flavours (comma separated)</label><textarea id="s_flavours" rows="2">${esc(s.flavours)}</textarea><label>Cream types (comma separated)</label><textarea id="s_creams" rows="2">${esc(s.creams)}</textarea>
  <div class="small mute" style="margin-top:8px">GST percentage is set per product in the Rate Master. The default 5% is a placeholder – confirm the correct rate for each product with your accountant.</div></div>
  <div class="row" style="margin:12px 0"><button class="btn gold" data-act="saveSettings">Save settings</button></div>
  <div class="card"><h3>Data &amp; backup</h3><div class="small" style="margin:6px 0 10px">⚠️ All data (rates, invoices, users) is stored <b>in this browser only</b> – it is not synced between devices. Export a backup regularly. The backup file contains PIN hashes; keep it private.</div><div class="row wrap"><button class="btn" data-act="backup">⬇ Export backup (JSON)</button><label class="btn ghost" style="margin:0;text-transform:none;font-size:15px;color:var(--choc);cursor:pointer">⬆ Restore backup<input type="file" id="s_rest" accept=".json,application/json" style="display:none"></label><button class="btn bad" data-act="resetAll">Erase all data</button></div></div>`;
  $('#s_logo').onchange=e=>{
    const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Choose an image file','bad');
    const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,260/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);db.settings.logo=c.toDataURL('image/png');audit('settings','Logo','Logo updated');save();toast('Logo updated','ok');render()};im.onerror=()=>toast('Could not read that image','bad');im.src=rd.result};rd.readAsDataURL(f);
  };
  $('#s_rest').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.products)||!Array.isArray(d.users)||!d.settings||!Array.isArray(d.invoices))throw 0;if(!d.users.some(u=>u.role==='owner'&&u.active))throw 0;if(!confirm('Replace ALL current data with this backup? You will be signed out.'))return;db=d;save();ACT.logout()}catch(x){toast('That file is not a valid backup','bad')}};rd.readAsText(f);
  };
};
ACT.logoClear=()=>{db.settings.logo='';save();render()};
ACT.saveSettings=()=>{
  if(!can('settings.edit'))return deny();const s=db.settings,g=i=>$('#s_'+i).value;
  const md=Number(g('maxDisc'));if(!(md>=0&&md<=100))return toast('Max discount must be 0–100','bad');
  if(!g('shopName').trim())return toast('Shop name is required','bad');
  const gi=g('gstInclusive')==='1';if(gi!==s.gstInclusive)audit('settings','GST mode','Prices include GST',String(s.gstInclusive),String(gi));
  if(md!==s.maxDisc)audit('settings','Cashier discount cap','Max discount %',s.maxDisc+'%',md+'%');
  Object.assign(s,{shopName:g('shopName').trim(),tagline:g('tagline').trim(),phone:g('phone').trim(),gstin:g('gstin').trim(),upi:g('upi').trim(),prefix:(g('prefix').trim()||'INV').toUpperCase(),address:g('address').trim(),footer:g('footer').trim(),gstInclusive:gi,gstSplit:g('gstSplit')==='1',roundOff:g('roundOff')==='1',maxDisc:md,flavours:g('flavours'),creams:g('creams')});
  save();toast('Settings saved','ok');render();
};
ACT.backup=()=>{if(!can('data.backup'))return deny();audit('settings','Backup','Backup exported');save();downloadFile(`bakery-backup-${today()}.json`,JSON.stringify(db),'application/json')};
ACT.resetAll=async()=>{if(!can('data.backup'))return deny();if((prompt('This permanently erases ALL data in this browser. Type ERASE to confirm.')||'')!=='ERASE')return;db=await seedDB();save();ACT.logout()};
 
/* ============ NOTIFICATIONS ============ */
const notified=new Set();let lastDay=today();
const pageFor=(p,fb)=>{const r=ROLE_PAGES[me.role];return r.includes(p)?p:r.includes(fb)?fb:r[0]};
function computeAlerts(){
  if(!me||!db)return[];
  const A=[];
  db.orders.filter(o=>!isDoneOrder(o)).sort((a,b)=>(a.dDate+a.dTime).localeCompare(b.dDate+b.dTime)).forEach(o=>{
    const n=daysTo(o.dDate),hv=o.handover==='Delivery'?'Delivery':'Pickup',inv=invOf(o),bal=inv&&inv.status!=='void'?balOf(inv):0;
    let kind,sev,title;
    if(n<0){kind='late';sev=0;title=`${hv} overdue by ${-n} day${n<-1?'s':''}`}
    else if(n===0){kind='today';sev=1;title=`${hv} TODAY at ${fmtT(o.dTime)}`}
    else if(n===1){kind='de';sev=2;title=`${hv} tomorrow at ${fmtT(o.dTime)}`}
    else if(n===2){kind='in';sev=3;title=`${hv} in 2 days – ${fmtD(o.dDate)} ${fmtT(o.dTime)}`}
    else return;
    const body=`${o.no} · ${o.cake} ${o.weight} · ${o.cust.name}`+(can('pay.view')&&bal>0?` · Balance ${money(bal)}`:'')+` · ${o.status}`;
    A.push({key:o.id+':'+kind,kind,sev,flag:(kind==='in'||kind==='de')?kind:'',icon:kind==='late'?'⛔':'⏰',title,body,page:pageFor('orders','invoices'),order:true});
  });
  if(can('stock.edit')){const low=db.products.filter(p=>p.track&&p.stock<=p.low);if(low.length)A.push({key:'stock:'+low.length,kind:'stock',sev:4,flag:'',icon:'📦',title:`${low.length} item(s) low or out of stock`,body:low.slice(0,4).map(p=>p.name).join(', ')+(low.length>4?'…':''),page:'stock'})}
  return A.sort((a,b)=>a.sev-b.sev);
}
const alertItem=cls=>a=>`<div class="${cls} ${a.kind}" data-act="nlink" data-p="${a.page}">${a.flag?`<span class="flag ${a.flag}"></span>`:`<span class="ic">${a.icon}</span>`}<div><b>${esc(a.title)}</b><div class="small">${esc(a.body)}</div></div></div>`;
function alertStrip(){
  if(page==='orders')return '';
  const A=computeAlerts().filter(a=>a.order);if(!A.length)return '';
  return `<div class="astrip">${A.slice(0,3).map(alertItem('ai')).join('')}${A.length>3?`<div class="small mute" style="padding:2px 4px">+${A.length-3} more – tap 🔔 to see all</div>`:''}</div>`;
}
function updateBell(){const b=$('#bcnt');if(!b)return;const n=me?computeAlerts().length:0;b.textContent=n>9?'9+':n;b.style.display=n?'flex':'none'}
function drawPanel(){
  const A=computeAlerts();
  $('#npanel').innerHTML=`<div class="nph"><span>🔔 Notifications</span><button class="btn ghost sm" data-act="nclose">✕</button></div>`+(A.length?A.map(alertItem('nit')).join(''):'<div class="mute" style="padding:14px;text-align:center">All clear – no pending alerts 🎉</div>')+`<div class="small mute" style="margin-top:6px"><span class="flag in" style="width:22px;height:15px"></span> 2 days before pickup &nbsp; <span class="flag de" style="width:22px;height:15px"></span> 1 day before</div>`;
}
function checkAlerts(){
  if(!me)return;
  const fresh=computeAlerts().filter(a=>a.order&&!notified.has(a.key));
  fresh.forEach(a=>notified.add(a.key));
  fresh.slice(0,3).forEach(a=>toast(a.title+' – '+a.body,(a.kind==='late'||a.kind==='today')?'bad':'',{flag:a.flag,icon:a.flag?'':a.icon,ms:15000}));
  if(fresh.length>3)toast(`+${fresh.length-3} more order alert(s) – tap 🔔`,'warn',{ms:8000});
  updateBell();
}
ACT.bell=()=>{const p=$('#npanel');if(p.hidden){setMenu(false);drawPanel();p.hidden=false}else p.hidden=true};
ACT.nclose=()=>{$('#npanel').hidden=true};
ACT.nlink=t=>{$('#npanel').hidden=true;setMenu(false);go(t.dataset.p)};
document.addEventListener('click',e=>{const p=$('#npanel');if(p&&!p.hidden&&!e.target.closest('#npanel,.bell'))p.hidden=true});
setInterval(()=>{if(!me)return;if(today()!==lastDay){lastDay=today();notified.clear();render();checkAlerts();return}checkAlerts();if(!$('#npanel').hidden)drawPanel()},60000);
 
/* ============ init ============ */
(async function init(){
  db=loadDB();
  if(!db||!Array.isArray(db.products)){db=await seedDB();save()}
  const sid=sessionStorage.getItem('bk_sess');
  if(sid)me=db.users.find(u=>u.id===sid&&u.active)||null;
  render();checkAlerts();
})();
</script>
